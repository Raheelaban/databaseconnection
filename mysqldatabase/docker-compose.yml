services:
  mysql:
    image: mysql:8.0
    container_name: github-mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: databasedemo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmy-secret-pw"]
      timeout: 5s
      retries: 5

  app:
    image: febnotechkolkata/databasedemo:latest
    container_name: springboot-app-container
    ports:
      - "8080:8080"
    environment:
      DB_HOST: "mysql:3306"
      DB_USER: "root"
      DB_PASSWORD: "my-secret-pw"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
